name: quality-gate

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  checks:
    name: Lint, scripts, coverage and Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run non-browser quality checks
        run: npm run lint && npm run test:deploy && npm run test:coverage && npm run build
      - name: Share the checked Web build with every browser shard
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quality-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 1
      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-diagnostics-unit
          path: .tmp/*-golden-image-diff/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

  browser-tests:
    name: Browser tests ${{ matrix.shard }}/4
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: quality-web-build
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: Run every test assigned to this shard
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: npm run test:e2e:built -- --shard=${{ matrix.shard }}/4 --reporter=github,html,json,blob
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-diagnostics-browser-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            .tmp/*-golden-image-diff/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser report for aggregation
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-blob-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 7

  complete:
    name: All quality checks passed
    if: always()
    needs: [checks, browser-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.checks.result == 'success'
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7.1.0
        if: needs.checks.result == 'success'
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        if: needs.checks.result == 'success'
      - uses: actions/download-artifact@v8.0.2
        if: needs.checks.result == 'success'
        with:
          pattern: browser-blob-*
          path: all-blob-reports/
          merge-multiple: true
      - name: Merge all browser reports
        if: needs.checks.result == 'success'
        run: npx playwright merge-reports --reporter=html ./all-blob-reports
      - uses: actions/upload-artifact@v7.0.2
        if: always() && needs.checks.result == 'success'
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7
      # A successful report merge must never hide a failed, flaky or skipped shard.
      - name: Require every quality job to succeed
        if: always()
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success
