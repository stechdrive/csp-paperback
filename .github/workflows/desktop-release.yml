name: desktop-release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.15.0'
        required: true
        type: string

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

  build-desktop:
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

  publish-desktop-release:
    name: Publish desktop release
    needs: [quality-gate, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release publication tools
        uses: actions/checkout@v7.0.1
        with:
          # Use the executing workflow's tools even when manually rebuilding an older tag.
          ref: ${{ github.workflow_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Download audited desktop assets
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: desktop-*
          path: release-assets/
          merge-multiple: true
      - name: Verify and upload the complete asset set
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          expected_windows="CSP-Paperback_${version}_ja-windows-x64-portable.exe"
          expected_macos="CSP-Paperback_${version}_ja-macos-arm64.dmg"
          mapfile -t files < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#files[@]}" -ne 2 || "${files[0]}" != "$expected_macos" || "${files[1]}" != "$expected_windows" ]]; then
            echo "Expected exactly the Windows EXE and macOS DMG for $TAG_NAME." >&2
            exit 1
          fi
          test -s "release-assets/$expected_windows"
          test -s "release-assets/$expected_macos"
          # Only this job writes the Release; parallel OS jobs never race to create it.
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "CSP Paperback $TAG_NAME" --notes "CSP Paperback 最新デスクトップバイナリ配布。Version: $TAG_NAME"
          fi
          gh release upload "$TAG_NAME" "release-assets/$expected_windows" "release-assets/$expected_macos" \
            --repo "$GITHUB_REPOSITORY" --clobber
          mapfile -t assets < <(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          if [[ "${#assets[@]}" -ne 2 || "${assets[0]}" != "$expected_macos" || "${assets[1]}" != "$expected_windows" ]]; then
            echo "Unexpected uploaded release asset set." >&2
            exit 1
          fi
      - name: Publish audited release
        run: gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
      - name: Delete older published releases
        run: node scripts/prune-releases.mjs "$GITHUB_REPOSITORY" "$TAG_NAME" --apply
