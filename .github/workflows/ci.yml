name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml

  # Tag runs can restore default-branch caches, but cannot restore another tag's cache.
  # Build with the same inputs as releases so future tags reuse both Rust profiles.
  build-desktop:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/desktop-build.yml
