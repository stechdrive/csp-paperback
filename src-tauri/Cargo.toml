[package]
name = "csp-paperback"
version = "1.38.306"
description = "Animation artwork exporter for Clip Studio Paint"
authors = ["stechdrive"]
edition = "2021"
license = "MIT"

[lib]
name = "csp_paperback_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-opener = "2.7.2"
tempfile = "3.27.0"
percent-encoding = "2.3.2"
